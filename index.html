<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girish URL Shortener</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron for headings, Share Tech Mono for code-like text, Inter for general UI -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Tailwind Shadow for a prominent neon glow effect */
        .shadow-neon-glow {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.7), 0 0 60px rgba(0, 255, 255, 0.4); /* More intense Cyan glow */
        }
        html.light .shadow-neon-glow { /* Less intense in light mode */
            box-shadow: 0 0 15px rgba(37, 150, 190, 0.4), 0 0 30px rgba(37, 150, 190, 0.2);
        }

        /* Base styles for dark mode (default for cyberpunk theme) */
        body {
            font-family: 'Inter', sans-serif; /* Default font for general text */
            background: linear-gradient(135deg, #0a0d11 0%, #030507 100%); /* Even deeper, more saturated dark gradient */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background 0.8s ease-in-out;
            /* Removed overflow: hidden; to allow scrolling */
            position: relative;
            color: #e2e8f0; /* Light gray text for readability */
        }

        /* Light mode styles (if user switches) */
        html.light body {
            background: linear-gradient(135deg, #e0f2f7 0%, #bbdefb 100%); /* Soft blue gradient */
            color: #2d3748; /* Darker text */
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 15, 15, 0.5); /* Even darker track for cyberpunk */
            border-radius: 10px;
        }
        html.light ::-webkit-scrollbar-track {
            background: rgba(220, 220, 220, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.7); /* More vibrant Neon cyan thumb */
            border-radius: 10px;
        }
        html.light ::-webkit-scrollbar-thumb {
            background: rgba(180, 180, 180, 0.8);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.9);
        }
        html.light ::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.9);
        }

        /* Particle Container */
        #particles-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Particle Styling */
        .particle {
            position: absolute;
            background-color: rgba(0, 255, 255, 0.25); /* More visible Cyan neon */
            border-radius: 50%;
            animation: floatAndFade 40s infinite linear; /* Longer, linear animation */
            opacity: 0;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6); /* Stronger neon glow */
            filter: blur(2px); /* More blur for depth */
        }

        html.light .particle {
            background-color: rgba(0, 150, 255, 0.1); /* Lighter blue in light mode */
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        }

        /* Keyframes for particle animation */
        @keyframes floatAndFade {
            0% {
                transform: translateY(0) translateX(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            50% {
                transform: translateY(-100vh) translateX(50vw) scale(1.2) rotate(180deg); /* More pronounced scale and rotation */
                opacity: 0.3;
            }
            80% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-200vh) translateX(100vw) scale(0.8) rotate(360deg); /* Full rotation */
                opacity: 0;
            }
        }

        /* Custom animation for message box */
        @keyframes fadeInOutScale {
            0% { opacity: 0; transform: translateY(-15px) scale(0.9); }
            10% { opacity: 1; transform: translateY(0) scale(1); }
            90% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-15px) scale(0.9); }
        }
        .message-box-animation {
            animation: fadeInOutScale 5s forwards;
        }

        /* Input focus glow animation */
        @keyframes inputGlow {
            0% { box-shadow: 0 0 0px rgba(0, 255, 255, 0); }
            50% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.7); }
            100% { box-shadow: 0 0 0px rgba(0, 255, 255, 0); }
        }
        .input-glow-animation:focus {
            animation: inputGlow 1.5s infinite alternate;
        }

        /* Button hover pulse animation */
        @keyframes buttonPulse {
            0% { transform: scale(1); box-shadow: 0 0 0px rgba(0, 255, 255, 0); }
            50% { transform: scale(1.03); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 0px rgba(0, 255, 255, 0); }
        }
        .btn-hover-pulse:hover {
            animation: buttonPulse 0.8s infinite alternate;
        }

        /* History item fade-in animation */
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .history-item-enter {
            animation: fadeInSlideUp 0.5s ease-out forwards;
        }

        /* Glitch effect for loading text */
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #00ffff, -0.05em -0.025em 0 #ff00ff, -0.025em 0.05em 0 #ff0000; }
            15% { text-shadow: 0.05em 0 0 #00ffff, -0.05em -0.025em 0 #ff00ff, -0.025em 0.05em 0 #ff0000; }
            16% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            17% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            18% { text-shadow: 0.05em 0.025em 0 #00ffff, -0.025em -0.05em 0 #ff00ff, -0.05em 0 0 #ff0000; }
            19% { text-shadow: 0.05em 0.025em 0 #00ffff, -0.025em -0.05em 0 #ff00ff, -0.05em 0 0 #ff0000; }
            20% { text-shadow: 0.05em 0 0 #00ffff, -0.05em -0.025em 0 #ff00ff, -0.025em 0.05em 0 #ff0000; }
            21% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            22% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            79% { text-shadow: 0.05em 0 0 #00ffff, -0.05em -0.025em 0 #ff00ff, -0.025em 0.05em 0 #ff0000; }
            80% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            99% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.05em 0 #ff00ff, 0.05em 0 0 #ff0000; }
            100% { text-shadow: 0 0 0 #00ffff, 0 0 0 #ff00ff, 0 0 0 #ff0000; }
        }
        .glitch-text {
            animation: glitch 2s infinite linear alternate;
        }

    </style>
</head>
<body class="antialiased">
    <!-- Animated Particle Background -->
    <div id="particles-background"></div>

    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="absolute top-8 right-8 p-3 rounded-full bg-gray-800 bg-opacity-70 backdrop-filter backdrop-blur-sm shadow-md text-cyan-400 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 z-10 hover:scale-110 active:scale-95 transform-gpu border border-cyan-600 border-opacity-50 light:bg-white light:text-gray-800 light:border-gray-200">
        <!-- Sun icon for light mode -->
        <svg id="sunIcon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h1M3 12h1m15.325-7.757l-.707-.707M4.343 19.657l-.707-.707m14.314 0l-.707.707M4.343 4.343l-.707.707"/>
        </svg>
        <!-- Moon icon for dark mode -->
        <svg id="moonIcon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>

    <div class="bg-gray-950 bg-opacity-90 backdrop-filter backdrop-blur-xl p-14 rounded-2xl shadow-neon-glow w-full max-w-xl mx-auto transform transition-all duration-700 hover:scale-[1.005] relative z-0 border border-cyan-500 border-opacity-40 overflow-hidden
                light:bg-white light:bg-opacity-95 light:shadow-lg light:border-gray-200">
        <h1 class="text-6xl font-black text-center text-cyan-400 mb-12 leading-tight font-orbitron light:text-gray-800">GIRISH <span class="text-fuchsia-400 light:text-blue-600">URL</span> SHORTENER</h1>

        <div class="mb-10">
            <label for="longUrl" class="block text-gray-300 text-lg font-semibold mb-4 light:text-gray-700 font-orbitron">INPUT >></label>
            <input type="url" id="longUrl" placeholder="https://neural-network.com/long-data-stream-url"
                   class="w-full px-6 py-4 border border-cyan-500 border-opacity-60 bg-gray-900 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition duration-300 ease-in-out placeholder-gray-600 text-cyan-300 text-xl outline-none font-share-tech-mono input-glow-animation
                          light:bg-white light:border-gray-300 light:text-gray-800 light:placeholder-gray-400">
        </div>

        <button id="shortenBtn"
                class="w-full bg-gradient-to-r from-cyan-600 to-fuchsia-600 text-white font-extrabold py-5 rounded-xl shadow-lg hover:from-cyan-700 hover:to-fuchsia-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-400 transition duration-300 ease-in-out active:scale-95 text-2xl tracking-wider font-orbitron btn-hover-pulse
                       light:bg-blue-500 light:hover:bg-blue-600 light:text-white">
            PROCESS // SHORTEN
        </button>

        <div id="loadingIndicator" class="hidden text-center mt-8 text-cyan-400 font-bold text-xl light:text-blue-600">
            <span class="animate-pulse glitch-text">_LOADING DATA_</span>
        </div>

        <div id="resultContainer" class="hidden mt-10 bg-gray-900 bg-opacity-70 p-8 rounded-xl border border-cyan-500 border-opacity-40 shadow-sm
                    light:bg-gray-100 light:bg-opacity-80 light:border-gray-200">
            <label class="block text-gray-300 text-lg font-semibold mb-4 light:text-gray-700 font-orbitron">OUTPUT >></label>
            <div class="flex flex-col sm:flex-row items-center space-y-5 sm:space-y-0 sm:space-x-5">
                <input type="text" id="shortUrl" readonly
                       class="flex-grow min-w-0 w-full sm:w-auto px-5 py-3 border border-cyan-500 border-opacity-60 bg-gray-800 rounded-lg text-cyan-300 font-share-tech-mono text-base sm:text-lg cursor-text select-all outline-none input-glow-animation
                              light:bg-white light:border-gray-300 light:text-gray-800">
                <div class="flex space-x-3 w-full sm:w-auto">
                    <button id="openLinkBtn"
                            class="flex-shrink-0 bg-cyan-600 text-white p-3 rounded-lg shadow-md hover:bg-cyan-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-400 transition duration-200 ease-in-out flex items-center justify-center active:scale-95 text-base font-medium font-orbitron btn-hover-pulse">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                        OPEN
                    </button>
                    <button id="copyBtn"
                            class="flex-shrink-0 bg-fuchsia-600 text-white p-3 rounded-lg shadow-md hover:bg-fuchsia-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-fuchsia-400 transition duration-200 ease-in-out flex items-center justify-center active:scale-95 text-base font-medium font-orbitron btn-hover-pulse">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                            <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h4.586a1 1 0 00.707-.293l3.414-3.414a1 1 0 00.293-.707V6a2 2 0 00-2-2h-1V3a1 1 0 11-2 0v1H6zm1-1h2v2H7V2z" />
                        </svg>
                        COPY
                    </button>
                </div>
            </div>
        </div>

        <div id="messageBox" class="hidden mt-8 p-4 rounded-lg text-base text-center font-medium message-box-animation light:text-gray-800" role="alert">
            <!-- Messages will be displayed here -->
        </div>

        <!-- Recent Shortened URLs History Section -->
        <div id="historySection" class="mt-12 pt-10 border-t border-gray-700 light:border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-cyan-400 light:text-gray-800 font-orbitron">LOGS // HISTORY</h2>
                <button id="clearHistoryBtn"
                        class="px-4 py-2 bg-red-700 text-white rounded-lg text-base shadow-md hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-600 transition duration-200 ease-in-out active:scale-95 font-orbitron
                               light:bg-red-500 light:hover:bg-red-600">
                    CLEAR // LOGS
                </button>
            </div>
            <div id="historyList" class="space-y-4 max-h-80 overflow-y-auto p-4 rounded-xl bg-gray-900 bg-opacity-70 border border-cyan-500 border-opacity-30
                        light:bg-gray-100 light:bg-opacity-80 light:border-gray-200">
                <!-- History items will be dynamically added here -->
                <p id="noHistoryMessage" class="text-gray-500 text-center py-6 text-lg light:text-gray-600 font-share-tech-mono">NO DATA LOGGED. INITIATE SHORTENING PROTOCOL.</p>
            </div>
        </div>
    </div>

    <script>
        // TinyURL API key provided by the user
        const TINYURL_API_KEY = "UkFz3QK2fAEfzPkUxp5j4SQAkZgVGgjsOPYjXU02Lk2jlSJcXmtVHXzvAeai";
        const HISTORY_KEY = 'urlShortenerHistory'; // Key for localStorage

        // Get DOM elements
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const longUrlInput = document.getElementById('longUrl');
        const shortenBtn = document.getElementById('shortenBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const shortUrlInput = document.getElementById('shortUrl');
        const copyBtn = document.getElementById('copyBtn');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const messageBox = document.getElementById('messageBox');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const noHistoryMessage = document.getElementById('noHistoryMessage');
        const particlesBackground = document.getElementById('particles-background');

        // --- Particle Generation Logic ---
        /**
         * Generates animated particles in the background.
         */
        function createParticles() {
            const numberOfParticles = 70; // Increased particle count for more density
            particlesBackground.innerHTML = ''; // Clear existing particles

            for (let i = 0; i < numberOfParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                // Randomize size
                const size = Math.random() * 20 + 8; // 8px to 28px
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;

                // Randomize starting position (bottom of the screen)
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.bottom = `-${size}px`; // Start just below the viewport

                // Randomize animation duration and delay
                const duration = Math.random() * 40 + 30; // 30s to 70s for very smooth, long animations
                const delay = Math.random() * 30; // 0s to 30s
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                particlesBackground.appendChild(particle);
            }
        }

        // Create particles on load
        createParticles();

        // --- Theme Switching Logic ---
        /**
         * Sets the theme based on the provided mode.
         * @param {string} mode - 'light' or 'dark'.
         */
        function setTheme(mode) {
            if (mode === 'dark') {
                htmlElement.classList.add('dark');
                htmlElement.classList.remove('light'); /* Ensure light class is removed */
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light'); /* Ensure light class is added */
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
            localStorage.setItem('theme', mode); // Persist theme preference
        }

        // Initialize theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            // Default to dark theme for cyberpunk aesthetic
            setTheme('dark');
        }

        // Toggle theme on button click
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });

        // --- Message Box Logic ---
        /**
         * Displays a message in the message box.
         * @param {string} message - The message to display.
         * @param {string} type - The type of message ('success' or 'error' or 'info').
         */
        function showMessage(message, type) {
            messageBox.textContent = message;
            // Remove previous classes
            messageBox.className = 'mt-8 p-4 rounded-lg text-base text-center font-medium message-box-animation';

            // Apply theme-specific classes
            if (htmlElement.classList.contains('dark')) {
                if (type === 'success') {
                    messageBox.classList.add('bg-green-800', 'text-green-100');
                } else if (type === 'error') {
                    messageBox.classList.add('bg-red-800', 'text-red-100');
                } else if (type === 'info') {
                    messageBox.classList.add('bg-yellow-800', 'text-yellow-100');
                }
            } else { /* Light mode */
                if (type === 'success') {
                    messageBox.classList.add('bg-green-100', 'text-green-800');
                } else if (type === 'error') {
                    messageBox.classList.add('bg-red-100', 'text-red-800');
                } else if (type === 'info') {
                    messageBox.classList.add('bg-yellow-100', 'text-yellow-800');
                }
            }
            // Show message box
            messageBox.classList.remove('hidden');
            // Hide message after 5 seconds (animation duration)
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 5000);
        }

        // --- URL Shortening Logic ---
        /**
         * Handles the URL shortening process.
         */
        shortenBtn.addEventListener('click', async () => {
            const longUrl = longUrlInput.value.trim();

            // Basic URL validation
            if (!longUrl) {
                showMessage('ERROR: INPUT REQUIRED.', 'error');
                return;
            }
            // More robust URL validation
            try {
                new URL(longUrl);
            } catch (e) {
                showMessage('ERROR: INVALID URL PROTOCOL.', 'error');
                return;
            }

            // Show loading indicator and disable button
            loadingIndicator.classList.remove('hidden');
            shortenBtn.disabled = true;
            shortenBtn.classList.add('opacity-50', 'cursor-not-allowed');
            resultContainer.classList.add('hidden'); // Hide previous result

            try {
                const response = await fetch('https://api.tinyurl.com/create', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TINYURL_API_KEY}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: longUrl,
                        domain: "tinyurl.com" // Default domain
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.errors ? errorData.errors.map(err => err.message).join(', ') : 'FAILED TO PROCESS URL.');
                }

                const data = await response.json();
                const shortenedUrl = data.data.tiny_url;

                // Display the shortened URL
                shortUrlInput.value = shortenedUrl;
                resultContainer.classList.remove('hidden');
                showMessage('PROTOCOL COMPLETE: URL SHORTENED.', 'success');

                // Add to history
                addToHistory(longUrl, shortenedUrl);

            } catch (error) {
                console.error('Error shortening URL:', error);
                showMessage(`ERROR: ${error.message}`, 'error');
                resultContainer.classList.add('hidden'); // Ensure result is hidden on error
            } finally {
                // Hide loading indicator and re-enable button
                loadingIndicator.classList.add('hidden');
                shortenBtn.disabled = false;
                shortenBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // --- Copy to Clipboard Logic ---
        /**
         * Copies the shortened URL to the clipboard.
         */
        copyBtn.addEventListener('click', () => {
            // Select the text in the input field
            shortUrlInput.select();
            shortUrlInput.setSelectionRange(0, 99999); // For mobile devices

            try {
                // Copy the text to the clipboard
                document.execCommand('copy');
                showMessage('DATA TRANSFER: CLIPBOARD.', 'info');
            } catch (err) {
                console.error('Failed to copy text: ', err);
                showMessage('ERROR: MANUAL COPY REQUIRED.', 'error');
            }
        });

        // --- Open Link Logic ---
        /**
         * Opens the shortened URL in a new tab.
         */
        openLinkBtn.addEventListener('click', () => {
            const shortUrl = shortUrlInput.value;
            if (shortUrl) {
                window.open(shortUrl, '_blank');
            } else {
                showMessage('WARNING: NO URL TO OPEN.', 'info');
            }
        });

        // --- History Logic ---
        let urlHistory = [];

        /**
         * Loads history from localStorage.
         */
        function loadHistory() {
            const storedHistory = localStorage.getItem(HISTORY_KEY);
            if (storedHistory) {
                urlHistory = JSON.parse(storedHistory);
            }
            renderHistory();
        }

        /**
         * Saves history to localStorage.
         */
        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(urlHistory));
        }

        /**
         * Adds a new URL pair to history and updates display.
         * @param {string} longUrl - The original long URL.
         * @param {string} shortUrl - The shortened URL.
         */
        function addToHistory(longUrl, shortUrl) {
            // Add new item to the beginning of the array
            urlHistory.unshift({ long: longUrl, short: shortUrl, timestamp: new Date().toISOString() });
            // Keep only the last 10 items
            if (urlHistory.length > 10) {
                urlHistory = urlHistory.slice(0, 10);
            }
            saveHistory();
            renderHistory();
        }

        /**
         * Renders the history list in the UI.
         */
        function renderHistory() {
            historyList.innerHTML = ''; // Clear existing list
            if (urlHistory.length === 0) {
                noHistoryMessage.classList.remove('hidden');
                clearHistoryBtn.classList.add('hidden');
            } else {
                noHistoryMessage.classList.add('hidden');
                clearHistoryBtn.classList.remove('hidden');
                urlHistory.forEach((item, index) => {
                    const historyItem = document.createElement('div');
                    // Apply theme-specific classes for history items
                    historyItem.className = `p-4 rounded-xl shadow-sm flex flex-col sm:flex-row sm:items-center justify-between space-y-3 sm:space-y-0 transform transition-all duration-200 hover:scale-[1.01] hover:shadow-md border history-item-enter
                                            ${htmlElement.classList.contains('dark') ? 'bg-gray-950 border-cyan-500 border-opacity-20' : 'bg-white border-gray-100'}`;
                    historyItem.innerHTML = `
                        <div class="flex-grow min-w-0">
                            <p class="text-sm text-gray-400 truncate mb-1 light:text-gray-600 font-share-tech-mono" title="${item.long}">ORIGINAL: <span class="text-cyan-300 light:text-gray-800">${item.long}</span></p>
                            <a href="${item.short}" target="_blank" rel="noopener noreferrer" class="text-cyan-400 hover:underline font-bold text-base sm:text-lg break-all font-share-tech-mono light:text-blue-600">SHORTENED: ${item.short}</a>
                        </div>
                        <button class="copy-history-btn px-4 py-2 rounded-md text-sm font-medium transition-colors duration-200 active:scale-95 font-orbitron btn-hover-pulse
                                        ${htmlElement.classList.contains('dark') ? 'bg-fuchsia-600 text-white hover:bg-fuchsia-700 focus:ring-fuchsia-400' : 'bg-gray-200 text-gray-700 hover:bg-gray-300 focus:ring-blue-400'}">COPY</button>
                    `;
                    historyList.appendChild(historyItem);
                });
                // Add event listeners to new copy buttons
                document.querySelectorAll('.copy-history-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        // Find the short URL from the sibling <a> tag
                        const urlToCopy = event.target.closest('div').querySelector('a').href.replace('SHORTENED: ', ''); // Remove "SHORTENED: " prefix
                        copyToClipboard(urlToCopy);
                    });
                });
            }
        }

        /**
         * Copies text to clipboard.
         * @param {string} text - The text to copy.
         */
        function copyToClipboard(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); // For mobile devices
            try {
                document.execCommand('copy');
                showMessage('DATA TRANSFER: CLIPBOARD.', 'success');
            } catch (err) {
                console.error('Failed to copy text: ', err);
                showMessage('ERROR: MANUAL COPY REQUIRED.', 'error');
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        /**
         * Clears all history.
         */
        clearHistoryBtn.addEventListener('click', () => {
            // Using a custom message box instead of alert/confirm
            const confirmClear = window.confirm('CONFIRM: CLEAR ALL LOGS?');
            if (confirmClear) {
                urlHistory = [];
                saveHistory();
                renderHistory();
                showMessage('LOGS CLEARED. MEMORY OPTIMIZED.', 'success');
            }
        });

        // Load history when the page loads
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
